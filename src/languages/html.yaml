# HTML 特定规则
# 只保留 base.yaml 未覆盖的 HTML 独有规则
# scope 来源：VS Code 内置 html.tmLanguage.json（已验证）
tokenColors:
  # ========== Doctype 声明 ==========
  # html.tmLanguage: meta.tag.metadata.doctype.html
  - name: HTML Doctype
    scope:
      - "meta.tag.metadata.doctype.html"
    settings:
      foreground: "${border}"

  # ========== HTML Attribute Value ==========
  - name: HTML Attribute Value
    scope:
      - "string.quoted.double.html"
      - "string.quoted.single.html"
    settings:
      foreground: "${success}"

  # ========== HTML 文本内容 ==========
  # html.tmLanguage: text.html.basic
  - name: HTML Text Content
    scope:
      - "text.html.basic"
    settings:
      foreground: "${variableDim}"

  # ========== 内联标签 ==========
  - name: HTML Inline Tags
    scope:
      - "meta.tag.inline.start.html"
      - "meta.tag.object.start.html"
    settings:
      foreground: "${operator}"

  # ========== 标签标点符号 ==========
  - name: HTML Tag Punctuation
    scope:
      - "punctuation.definition.tag.begin.html"
      - "punctuation.definition.tag.end.html"
    settings:
      foreground: "${operator}"
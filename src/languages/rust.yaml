# Rust 特定规则
# 只保留 base.yaml 未覆盖的 Rust 独有规则
# scope 来源：VS Code 内置 rust.tmLanguage.json（已验证）
tokenColors:
  # ========== Rust 独有类型 ==========
  - name: Rust - Type Declarations (struct/enum/trait)
    scope:
      - "entity.name.type.struct.rust"
      - "entity.name.type.enum.rust"
      - "entity.name.type.trait.rust"
      - "entity.name.type.declaration.rust"
    settings:
      foreground: "${warning}"
      fontStyle: "bold"

  # ========== Rust - 基础类型（i32/u64/f64/str 等） ==========
  - name: Rust - Primitive Types
    scope:
      - "entity.name.type.primitive.rust"
      - "entity.name.type.numeric.rust"
    settings:
      foreground: "${cyan}"

  # ========== Rust - 特殊类型（Option/Result） ==========
  - name: Rust - Special Types
    scope:
      - "entity.name.type.option.rust"
      - "entity.name.type.result.rust"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== Rust - 生命周期 ==========
  - name: Rust - Lifetimes
    scope:
      - "entity.name.type.lifetime.rust"
      - "punctuation.definition.lifetime.rust"
    settings:
      foreground: "${cyan}"
      fontStyle: "italic"

  # ========== Rust - 宏 ==========
  - name: Rust - Macros
    scope:
      - "entity.name.function.macro.rust"
      - "entity.name.function.macro.rules.rust"
      - "meta.macro.rust"
    settings:
      foreground: "${function}"

  # ========== Rust - 属性 ==========
  - name: Rust - Attributes
    scope:
      - "meta.attribute.rust"
      - "meta.attribute.rust entity.name.type"
    settings:
      foreground: "${purple}"
      fontStyle: "italic"

  # ========== Rust 函数（定义统一加粗） ==========
  - name: Rust - Functions
    scope:
      - "entity.name.function.rust"
      - "meta.function.definition.rust entity.name.function"
    settings:
      foreground: "${function}"
      fontStyle: "bold"

  # ========== Rust - Self/Super ==========
  - name: Rust - Self / Super
    scope:
      - "variable.language.self.rust"
      - "variable.language.super.rust"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== Rust 常量（大写命名） ==========
  - name: Rust - Constants
    scope:
      - "constant.other.caps.rust"
    settings:
      foreground: "${warning}"
      fontStyle: "bold"

  # ========== Rust - 普通变量 ==========
  - name: Rust - Variables
    scope:
      - "variable.other.rust"
      - "variable.other.metavariable.name.rust"
      - "variable.other.metavariable.specifier.rust"
    settings:
      foreground: "${variable}"
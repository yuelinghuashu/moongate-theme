# Rust 特定规则
# 只保留 base.yaml 未覆盖的 Rust 独有规则
# scope 来源：VS Code 内置 rust.tmLanguage.json（已验证）
#
# ⚠️ 枚举变体（On/Off）的颜色不在本文件：语法只给出 catch-all entity.name.type.rust，
#    且语义层 enumMember 优先 —— 修复点在 src/semantic.yaml 的 "enumMember:rust"。
tokenColors:
  # ========== Rust 独有类型 ==========
  - name: Rust - Type Declarations (struct/enum/trait)
    scope:
      - "entity.name.type.struct.rust"
      - "entity.name.type.enum.rust"
      - "entity.name.type.trait.rust"
      - "entity.name.type.declaration.rust"
    settings:
      foreground: "${warning}"
      fontStyle: "bold"

  # ========== Rust - 基础类型（i32/u64/f64/str 等） ==========
  # support.type.primitive.rust 是 rust-analyzer 声明的探针 scope（semanticTokenScopes.builtinType）：
  # 它不在内置语法里，但语义 token 会按它回查本文件 —— 不写就会落到 base.yaml 的 support.type（黄）。
  - name: Rust - Primitive Types
    scope:
      - "entity.name.type.primitive.rust"
      - "entity.name.type.numeric.rust"
      - "support.type.primitive.rust"
    settings:
      foreground: "${cyan}"

  # ========== Rust - 特殊类型（Option/Result） ==========
  - name: Rust - Special Types
    scope:
      - "entity.name.type.option.rust"
      - "entity.name.type.result.rust"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== Rust - 生命周期 ==========
  # storage.modifier.lifetime.rust 是 rust-analyzer 的探针 scope（semanticTokenScopes.lifetime）：
  # 原样落回 base.yaml 的 storage.modifier（主蓝加粗），会让这里的青色斜体永远不生效。
  - name: Rust - Lifetimes
    scope:
      - "entity.name.type.lifetime.rust"
      - "punctuation.definition.lifetime.rust"
      - "storage.modifier.lifetime.rust"
    settings:
      foreground: "${cyan}"
      fontStyle: "italic"

  # ========== Rust - 格式化占位符 ==========
  # punctuation.section.embedded.rust 是 rust-analyzer 的探针 scope（semanticTokenScopes.formatSpecifier），
  # println!("{}") 里的 {} 走它；不写就是 base.yaml 的 punctuation 灰，弱于 JS 模板插值。
  - name: Rust - Format Specifiers
    scope:
      - "punctuation.section.embedded.rust"
    settings:
      foreground: "${highlight}"

  # ========== Rust - 宏（对齐语义层 macro: purple） ==========
  - name: Rust - Macros
    scope:
      - "entity.name.function.macro.rust"
      - "entity.name.function.macro.rules.rust"
      - "meta.macro.rust"
    settings:
      foreground: "${purple}"

  # ========== Rust - 属性 ==========
  - name: Rust - Attributes
    scope:
      - "meta.attribute.rust"
      - "meta.attribute.rust entity.name.type"
    settings:
      foreground: "${purple}"
      fontStyle: "italic"

  # ========== Rust 函数（定义统一加粗） ==========
  - name: Rust - Functions
    scope:
      - "entity.name.function.rust"
      - "meta.function.definition.rust entity.name.function"
    settings:
      foreground: "${function}"
      fontStyle: "bold"

  # ========== Rust - Self/Super ==========
  - name: Rust - Self / Super
    scope:
      - "variable.language.self.rust"
      - "variable.language.super.rust"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== Rust 常量（大写命名） ==========
  - name: Rust - Constants
    scope:
      - "constant.other.caps.rust"
    settings:
      foreground: "${warning}"
      fontStyle: "bold"

  # ========== Rust - 普通变量 ==========
  - name: Rust - Variables
    scope:
      - "variable.other.rust"
      - "variable.other.metavariable.name.rust"
      - "variable.other.metavariable.specifier.rust"
    settings:
      foreground: "${variable}"
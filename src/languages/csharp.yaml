# C# 特定规则
# 只保留 base.yaml 未覆盖的 C# 独有规则
# scope 来源：VS Code 内置 csharp.tmLanguage.json（已验证）
tokenColors:
  # ========== 特性 [Serializable] 等 ==========
  - name: C# - Attributes
    scope:
      - "entity.other.attribute-name.cs"
      - "entity.other.attribute-name.localname.cs"
      - "entity.other.attribute-name.namespace.cs"
    settings:
      foreground: "${purple}"
      fontStyle: "italic"

  # ========== 泛型 <T> ==========
  - name: C# - Generics
    scope:
      - "punctuation.definition.typeparameters.begin.cs"
      - "punctuation.definition.typeparameters.end.cs"
    settings:
      foreground: "${cyan}"

  # ========== 类/结构体/枚举/记录/委托声明（加粗） ==========
  - name: C# - Type Declarations
    scope:
      - "entity.name.type.class.cs"
      - "entity.name.type.struct.cs"
      - "entity.name.type.enum.cs"
      - "storage.type.record.cs"
      - "entity.name.type.delegate.cs"
    settings:
      foreground: "${warning}"
      fontStyle: "bold"

  # ========== 接口声明（对齐语义层 interface: primary） ==========
  - name: C# - Interface Declaration
    scope:
      - "entity.name.type.interface.cs"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== 函数定义（加粗，与 Go/Python/Rust 一致） ==========
  - name: C# - Function Definition
    scope:
      - "entity.name.function.cs"
    settings:
      foreground: "${function}"
      fontStyle: "bold"

  # ========== 类型参数名 <T>（对齐语义层 typeParameter: cyan） ==========
  - name: C# - Type Parameters
    scope:
      - "entity.name.type.type-parameter.cs"
    settings:
      foreground: "${cyan}"

  # ========== this 关键字 ==========
  - name: C# - This
    scope:
      - "variable.language.this.cs"
    settings:
      foreground: "${primary}"
      fontStyle: "bold"

  # ========== 命名空间（对齐语义层 namespace: textMuted） ==========
  - name: C# - Namespace
    scope:
      - "entity.name.type.namespace.cs"
    settings:
      foreground: "${textMuted}"

  # ========== 预处理指令 ==========
  - name: C# - Preprocessor Directives
    scope:
      - "keyword.preprocessor.define.cs"
      - "keyword.preprocessor.if.cs"
      - "keyword.preprocessor.elif.cs"
      - "keyword.preprocessor.else.cs"
      - "keyword.preprocessor.endif.cs"
      - "keyword.preprocessor.region.cs"
      - "keyword.preprocessor.endregion.cs"
      - "keyword.preprocessor.warning.cs"
      - "keyword.preprocessor.error.cs"
      - "keyword.preprocessor.pragma.cs"
    settings:
      foreground: "${primary}"

  # ========== LINQ 查询关键字 ==========
  - name: C# - LINQ Keywords
    scope:
      - "keyword.operator.expression.query.from.cs"
      - "keyword.operator.expression.query.where.cs"
      - "keyword.operator.expression.query.select.cs"
      - "keyword.operator.expression.query.group.cs"
      - "keyword.operator.expression.query.orderby.cs"
      - "keyword.operator.expression.query.join.cs"
      - "keyword.operator.expression.query.into.cs"
      - "keyword.operator.expression.query.let.cs"
      - "keyword.operator.expression.query.on.cs"
      - "keyword.operator.expression.query.equals.cs"
      - "keyword.operator.expression.query.by.cs"
      - "keyword.operator.expression.query.in.cs"
    settings:
      foreground: "${cyan}"

  # ========== 委托/事件/运算符重载 ==========
  - name: C# - Delegate & Event
    scope:
      - "storage.type.delegate.cs"
      - "storage.type.event.cs"
      - "storage.type.operator.cs"
    settings:
      foreground: "${cyan}"

  # ========== 变量声明族（COVERAGE.md 补齐：字段/局部/参数/事件/预处理符号） ==========
  - name: C# - Variable Declarations
    scope:
      - "entity.name.variable.local.cs"
      - "entity.name.variable.field.cs"
      - "entity.name.variable.parameter.cs"
      - "entity.name.variable.event.cs"
      - "entity.name.variable.preprocessor.symbol.cs"
    settings:
      foreground: "${variable}"

  # ========== 标签（goto 标签） ==========
  - name: C# - Labels
    scope:
      - "entity.name.label.cs"
    settings:
      foreground: "${error}"

  # ========== 转义字符 ==========
  - name: C# - Escape Characters
    scope:
      - "constant.character.escape.cs"
    settings:
      foreground: "${highlight}"

  # ========== 字符串插值 ==========
  - name: C# - String Interpolation
    scope:
      - "punctuation.definition.interpolation.begin.cs"
      - "punctuation.definition.interpolation.end.cs"
    settings:
      foreground: "${highlight}"

  # ========== 数字字面量 ==========
  - name: C# - Numbers
    scope:
      - "constant.numeric.binary.cs"
      - "constant.numeric.hex.cs"
      - "constant.numeric.other.exponent.cs"
    settings:
      foreground: "${warning}"

  # ========== discard 变量 _ ==========
  - name: C# - Discard
    scope:
      - "variable.language.discard.cs"
    settings:
      foreground: "${operator}"
      fontStyle: "italic"
